name: Central QA Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out QA Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-mock
        if [ -f requirements.txt ]; then pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt; fi

    - name: Run Ruff Linting
      run: |
        ruff check . || echo "Ruff failed but continuing"

    - name: Run Global Tests (Pytest)
      run: |
        for dir in tests/tests_*/; do
          if [ -d "$dir" ]; then
            echo "Running pytest in $dir"
            pytest "$dir" -v --ignore-glob="*e2e*.py" || exit 1
          fi
        done
